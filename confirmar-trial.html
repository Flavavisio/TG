<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirmar conta — Total Gest</title>
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<!-- Impede que este link abra dentro da app instalada (PWA) em vez do browser normal —
     assim quem recebe o email vê sempre a barra de endereço (totalgest.pt) antes de clicar,
     o que ajuda a confiar que a página é legítima. -->
<meta name="mobile-web-app-capable" content="no" />
<meta name="apple-mobile-web-app-capable" content="no" />
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f4f6fa;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
  .card{background:#fff;padding:40px;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.1);text-align:center;max-width:420px;}
  .logo{display:block;margin:0 auto 20px;height:56px;}
  h1{font-size:1.25rem;margin:0 0 12px;}
  h1.ok{color:#16a34a;}
  h1.erro{color:#dc2626;}
  p{color:#5a6781;font-size:.92rem;margin:0 0 10px;line-height:1.5;}
  .botao{display:inline-block;background:#f4520e;color:#fff;padding:14px 30px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:14px;}
  [hidden]{display:none!important;}
  form{display:grid;gap:10px;text-align:left;}
  form input{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;}
  form button{font:inherit;border:0;cursor:pointer;}
  .selo{display:inline-block;background:#ecfdf5;color:#16a34a;font-weight:700;font-size:.8rem;padding:6px 14px;border-radius:999px;margin-bottom:14px;}
  .spinner{width:34px;height:34px;border:4px solid #e6eaf2;border-top-color:#f4520e;border-radius:50%;margin:0 auto 18px;animation:girar 0.8s linear infinite;}
  @keyframes girar{ to{ transform:rotate(360deg); } }
  .aviso{color:#b45309;font-size:.8rem;margin-top:18px;}
</style>
</head>
<body>
  <div class="card" id="cartao">
    <div style="font-size:.72rem;color:#94a3b8;margin-bottom:10px;letter-spacing:.03em;">🔒 totalgest.pt</div>
    <img class="logo" src="logo-totalgest.png" alt="Total Gest" />
    <h1>Confirme a sua conta Total Gest</h1>
    <p>Defina uma palavra-passe para ativar os seus 14 dias de teste.</p>
    <form id="confirmarConta">
      <label for="senha">Palavra-passe</label>
      <input id="senha" type="password" autocomplete="new-password" minlength="9" maxlength="72" required />
      <p>Use pelo menos 9 caracteres, uma maiúscula e um símbolo.</p>
      <label for="confirmacao">Confirme a palavra-passe</label>
      <input id="confirmacao" type="password" autocomplete="new-password" minlength="9" maxlength="72" required />
      <button type="submit" class="botao">Ativar conta</button>
    </form>
    <p class="aviso" id="resultado" role="status"></p>
    <a class="botao" id="entrar" href="login.html" hidden>Entrar agora</a>
  </div>

  <script>
    const url = 'https://rfniufasivfnrqfntzog.supabase.co/functions/v1/confirmar-trial';
    const token = new URLSearchParams(window.location.search).get('token');
    const formulario = document.getElementById('confirmarConta');
    const resultado = document.getElementById('resultado');
    const senha = document.getElementById('senha');
    const confirmacao = document.getElementById('confirmacao');
    if (!token) {
      formulario.hidden = true;
      resultado.textContent = 'Abra o endereço completo enviado por email.';
    }
    confirmacao.addEventListener('input', () => confirmacao.setCustomValidity(''));
    senha.addEventListener('input', () => confirmacao.setCustomValidity(''));
    formulario.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!token) return;
      if (senha.value !== confirmacao.value) {
        confirmacao.setCustomValidity('As palavras-passe não coincidem.');
        confirmacao.reportValidity();
        return;
      }
      const botao = formulario.querySelector('button');
      botao.disabled = true;
      resultado.textContent = 'A ativar a conta…';
      try {
        const resposta = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, senha: senha.value })
        });
        const dados = await resposta.json();
        resultado.textContent = dados.mensagem || 'Não foi possível ativar a conta.';
        if (dados.sucesso) {
          formulario.reset();
          formulario.hidden = true;
          document.getElementById('entrar').hidden = false;
        }
      } catch {
        resultado.textContent = 'Não foi possível ligar ao servidor. Tente novamente.';
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
