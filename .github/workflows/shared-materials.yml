name: Validate shared OS and worksite materials
on:
  push:
    branches:
      - feature/os-obras-materiais-partilhados
      - release/materials-os-obras-20261120
  pull_request:
    paths:
      - 'tg-materiais-partilhados.js'
      - 'tg-materiais-partilhados.css'
      - 'app-principal.js'
      - 'index.html'
      - 'login.html'
      - 'sw.js'
      - 'supabase/migrations/*_os_materiais_previstos.sql'
      - 'tests/materiais-*.test.cjs'
      - 'tests/os-materiais-integration.test.cjs'
      - '.github/workflows/shared-materials.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock jsdom@26 xlsx@0.18.5
      - run: node --check app-principal.js
      - run: node --check tg-materiais-partilhados.js
      - run: node --test tests/materiais-partilhados.test.cjs tests/materiais-ui-integration.test.cjs tests/os-materiais-integration.test.cjs tests/kiosk-planned-materials-ui.test.cjs tests/kiosk-planned-materials.test.cjs
