name: OS stress Produção simulado
on:
  push:
    branches:
      - validation/os-stress-production-20261112
jobs:
  stress:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DOM simulado
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Validar sintaxe
        run: |
          node --check app-principal.js
          node --check tg-technician.js
          node --check tests/os-production-stress.test.cjs
      - name: OS stress com dados fictícios
        run: node --test tests/os-production-stress.test.cjs
      - name: Regressões OS e tempos
        run: |
          node --test tests/os-individual-completion.test.cjs tests/kiosk-work-hours.test.cjs tests/worksite-cost-consistency.test.cjs tests/pause-reason-persistence.test.cjs tests/os-no-attendance-guards.test.cjs tests/technician-clock-refresh.test.cjs tests/service-time.test.cjs
