name: Validate lunch entry lock
on:
  push:
    branches:
      - fix/block-entry-during-lunch-20261113
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare test DOM
        run: npm install --no-save --no-package-lock jsdom@26
      - name: JS syntax
        run: |
          node --check tg-technician.js
          node --check sw.js
      - name: Lunch lock functional simulations
        run: node --test tests/os-production-stress.test.cjs
      - name: Timing and service regression
        run: |
          node --test tests/technician-clock-refresh.test.cjs tests/service-time-isolated.test.cjs tests/os-individual-completion.test.cjs tests/kiosk-work-hours.test.cjs tests/worksite-cost-consistency.test.cjs tests/pause-reason-persistence.test.cjs tests/os-no-attendance-guards.test.cjs
