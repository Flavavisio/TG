<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar conta - Total Gest</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#f4f7fc; margin:0; padding:24px; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); max-width:420px; width:100%; padding:36px 28px; text-align:center; }
  .icone { font-size:2.4rem; margin-bottom:12px; }
  h1 { font-size:1.3rem; color:#0b3b5c; margin:0 0 12px; }
  p { color:#334155; line-height:1.6; font-size:.95rem; }
  .ok { color:#16a34a; }
  .erro { color:#dc2626; }
  a.voltar { display:inline-block; margin-top:18px; color:#f4520e; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="card" id="cartao">
    <div class="icone">⏳</div>
    <h1>A confirmar a tua conta…</h1>
    <p>Um momento, por favor.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://rfniufasivfnrqfntzog.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmbml1ZmFzaXZmbnJxZm50em9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NzI2MjcsImV4cCI6MjA5NzQ0ODYyN30.1hJ7JBpCKo-Wp93HM5skXVnYk3ghyC7mo0rubbvCXyI';
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function mostrar(icone, titulo, texto, classe) {
      document.getElementById('cartao').innerHTML = `
        <div class="icone">${icone}</div>
        <h1 class="${classe || ''}">${titulo}</h1>
        <p>${texto}</p>
        <a class="voltar" href="index.html">Ir para a aplicação →</a>`;
    }

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) { mostrar('⚠️', 'Falta o código de confirmação', 'Este link não parece estar completo. Verifica se copiaste o link inteiro do email.', 'erro'); return; }

      try {
        const { data, error } = await supa.functions.invoke('confirmar-conta', { body: { token } });
        if (error || !data || !data.ok) {
          const motivo = (data && data.erro) || (error && error.message) || 'erro desconhecido';
          if (motivo.includes('expirad')) {
            mostrar('⏱️', 'O prazo já passou', 'Este link de confirmação já não é válido (as contas têm 48h para serem confirmadas). Pede ao teu administrador para criar a conta de novo.', 'erro');
          } else if (motivo.includes('já confirmada') || motivo.includes('ja confirmada')) {
            mostrar('✅', 'Conta já confirmada', 'Esta conta já tinha sido confirmada antes. Já podes entrar normalmente.', 'ok');
          } else {
            mostrar('⚠️', 'Não foi possível confirmar', 'Não encontrámos nenhuma conta à espera de confirmação com este link. Se achas que é um erro, contacta o teu administrador.', 'erro');
          }
          return;
        }
        mostrar('✅', 'Conta confirmada!', 'A tua conta na Total Gest já está pronta a usar. Podes entrar com o teu email e password.', 'ok');
      } catch (e) {
        mostrar('⚠️', 'Erro de ligação', 'Não foi possível confirmar a conta agora. Tenta outra vez daqui a pouco.', 'erro');
      }
    })();
  </script>
</body>
</html>
